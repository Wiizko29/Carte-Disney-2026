name: Update Database

on:
  repository_dispatch:
    types: [update-database]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update database.json
        run: |
          echo '${{ github.event.client_payload.data }}' > database.json
          git config --global user.name 'Bot Collection'
          git config --global user.email 'bot@users.noreply.github.com'
          git add database.json
          git commit -m "Mise à jour automatique de la base de données des cartes"
          git push
